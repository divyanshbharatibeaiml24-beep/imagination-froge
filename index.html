<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelDICOM VeilGuard | Medical Cybersecurity Command Center</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* ==========================================================================
       SENTINELDICOM VEILGUARD - ELITE CYBERSECURITY DESIGN SYSTEM
       ========================================================================== */
    :root {
      --bg-void: #02050c;
      --bg-deep: #050b18;
      --bg-surface: rgba(9, 16, 32, 0.85);
      --bg-surface-elevated: rgba(14, 25, 50, 0.9);
      --bg-surface-glass: rgba(11, 20, 42, 0.7);

      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-cyan: rgba(0, 212, 255, 0.22);
      --border-green: rgba(0, 255, 136, 0.25);
      --border-pink: rgba(255, 59, 110, 0.25);
      --border-violet: rgba(168, 85, 247, 0.25);
      --border-amber: rgba(255, 165, 0, 0.25);

      /* Cyber Radiance Accents */
      --cyan: #00d4ff;
      --cyan-glow: rgba(0, 212, 255, 0.4);
      --green: #00ff88;
      --green-glow: rgba(0, 255, 136, 0.4);
      --pink: #ff3b6e;
      --pink-glow: rgba(255, 59, 110, 0.4);
      --amber: #ffa500;
      --amber-glow: rgba(255, 165, 0, 0.4);
      --violet: #a855f7;
      --violet-glow: rgba(168, 85, 247, 0.4);

      /* Typography */
      --text-pure: #ffffff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --text-dark: #334155;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Orbitron', monospace;
      --font-mono: 'JetBrains Mono', monospace;
      --font-tech: 'Rajdhani', sans-serif;

      --sidebar-width: 256px;
      --header-height: 56px;
      --stepper-height: 42px;
      --footer-ticker-height: 30px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(0, 212, 255, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.02) 0%, transparent 60%),
        linear-gradient(rgba(2, 5, 12, 0.94), rgba(5, 11, 24, 0.97)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 212, 255, 0.015) 2px, rgba(0, 212, 255, 0.015) 4px);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(2, 5, 12, 0.8);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.25);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Utility Typography */
    .mono {
      font-family: var(--font-mono);
    }

    .display-font {
      font-family: var(--font-display);
    }

    .tech-font {
      font-family: var(--font-tech);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .badge-cyan {
      background: rgba(0, 212, 255, 0.12);
      color: var(--cyan);
      border: 1px solid var(--border-cyan);
    }

    .badge-green {
      background: rgba(0, 255, 136, 0.12);
      color: var(--green);
      border: 1px solid var(--border-green);
    }

    .badge-pink {
      background: rgba(255, 59, 110, 0.12);
      color: var(--pink);
      border: 1px solid var(--border-pink);
    }

    .badge-amber {
      background: rgba(255, 165, 0, 0.12);
      color: var(--amber);
      border: 1px solid var(--border-amber);
    }

    .badge-violet {
      background: rgba(168, 85, 247, 0.12);
      color: var(--violet);
      border: 1px solid var(--border-violet);
    }

    .badge:hover {
      filter: brightness(1.2);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      white-space: nowrap;
      user-select: none;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-solid-cyan {
      background: linear-gradient(135deg, #00d4ff, #0077b6);
      color: #02050c;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    .btn-solid-cyan:hover {
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
      background: linear-gradient(135deg, #33ddff, #0099e6);
    }

    .btn-cyan {
      background: rgba(0, 212, 255, 0.1);
      color: var(--cyan);
      border-color: var(--border-cyan);
    }

    .btn-cyan:hover {
      background: rgba(0, 212, 255, 0.22);
      border-color: var(--cyan);
    }

    .btn-green {
      background: rgba(0, 255, 136, 0.1);
      color: var(--green);
      border-color: var(--border-green);
    }

    .btn-green:hover {
      background: rgba(0, 255, 136, 0.22);
      border-color: var(--green);
    }

    .btn-pink {
      background: rgba(255, 59, 110, 0.1);
      color: var(--pink);
      border-color: var(--border-pink);
    }

    .btn-pink:hover {
      background: rgba(255, 59, 110, 0.22);
      border-color: var(--pink);
    }

    .btn-amber {
      background: rgba(255, 165, 0, 0.1);
      color: var(--amber);
      border-color: var(--border-amber);
    }

    .btn-amber:hover {
      background: rgba(255, 165, 0, 0.22);
      border-color: var(--amber);
    }

    .btn-violet {
      background: rgba(168, 85, 247, 0.1);
      color: var(--violet);
      border-color: var(--border-violet);
    }

    .btn-violet:hover {
      background: rgba(168, 85, 247, 0.22);
      border-color: var(--violet);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border-subtle);
    }

    .btn-ghost:hover {
      color: var(--text-pure);
      border-color: var(--border-cyan);
      background: rgba(255, 255, 255, 0.04);
    }

    /* Glassmorphism Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .card:hover {
      border-color: rgba(0, 212, 255, 0.35);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.4), transparent);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-pure);
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: 0.3px;
    }

    .card-title .icon-wrap {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid var(--border-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--cyan);
    }

    /* Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    /* KPI Tiles */
    .kpi-tile {
      background: linear-gradient(145deg, rgba(14, 25, 52, 0.85), rgba(7, 13, 28, 0.95));
      border: 1px solid var(--border-cyan);
      border-radius: 10px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .kpi-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .kpi-tile .kpi-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .kpi-tile .kpi-val {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .kpi-tile .kpi-sub {
      font-size: 10.5px;
      color: var(--text-dim);
    }

    .kpi-tile .kpi-glow {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      filter: blur(25px);
      pointer-events: none;
    }

    /* ═══════════════ SIDEBAR ═══════════════ */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100vh;
      background: rgba(5, 11, 24, 0.97);
      border-right: 1px solid var(--border-cyan);
      display: flex;
      flex-direction: column;
      z-index: 100;
      backdrop-filter: blur(20px);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.6);
    }

    .sidebar-brand {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(0, 212, 255, 0.05), transparent);
    }

    .sidebar-brand .shield-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.25);
      animation: pulse-slow 3s infinite alternate;
    }

    .sidebar-brand .shield-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .sidebar-brand .brand-title {
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .sidebar-brand .brand-sub {
      font-size: 9.5px;
      color: var(--text-dim);
      letter-spacing: 0.6px;
      font-family: var(--font-mono);
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
    }

    .nav-header {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 12px 4px;
      margin-top: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      margin: 3px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      transform: translateX(2px);
    }

    .nav-item.active {
      background: rgba(0, 212, 255, 0.08);
      color: #ffffff;
      font-weight: 600;
    }

    .nav-item .icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .nav-item .icon svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.8;
      stroke: currentColor;
      fill: none;
      transition: all 0.2s ease;
    }

    .nav-item:hover .icon {
      background: rgba(0, 212, 255, 0.12);
      border-color: rgba(0, 212, 255, 0.3);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
    }

    .nav-item.active .icon {
      background: linear-gradient(135deg, #00d4ff, #0077b6);
      border-color: #00d4ff;
      color: #02050c;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
    }

    .nav-item.active .icon svg {
      stroke: #02050c;
      stroke-width: 2.2;
    }

    .nav-item .nav-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-item.active .nav-count {
      background: rgba(0, 212, 255, 0.2);
      color: var(--cyan);
    }

    .sidebar-telemetry {
      padding: 12px 14px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(3, 7, 16, 0.6);
      font-size: 10.5px;
    }

    .telemetry-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
      color: var(--text-dim);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-beacon 1.6s infinite;
      display: inline-block;
    }

    /* ═══════════════ MAIN CONTENT ═══════════════ */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Header */
    #header {
      height: var(--header-height);
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--border-cyan);
      background: rgba(5, 11, 24, 0.88);
      backdrop-filter: blur(16px);
      z-index: 50;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan-glow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .study-selector-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(14, 25, 52, 0.7);
      border: 1px solid var(--border-cyan);
      border-radius: 7px;
      padding: 4px 10px;
    }

    .study-selector-wrap select {
      background: transparent;
      border: none;
      color: var(--text-pure);
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      outline: none;
    }

    .study-selector-wrap select option {
      background: #070e1e;
      color: var(--text-main);
    }

    /* ═══════════════ PIPELINE STEPPER ═══════════════ */
    #stepper {
      height: var(--stepper-height);
      min-height: var(--stepper-height);
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(3, 7, 16, 0.9);
      overflow-x: auto;
      gap: 4px;
    }

    .step-node {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      user-select: none;
    }

    .step-node:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .step-node.completed {
      color: var(--green);
    }

    .step-node.active {
      color: #02050c;
      background: var(--cyan);
      font-weight: 700;
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .step-node.quarantined {
      color: var(--pink);
      background: rgba(255, 59, 110, 0.15);
    }

    .step-arrow {
      color: var(--text-dark);
      font-size: 10px;
      margin: 0 2px;
    }

    /* Content Area */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    /* ═══════════════ DICOM WORKSTATION VIEWER ═══════════════ */
    .viewer-shell {
      background: #000000;
      border: 1px solid var(--border-cyan);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    .viewer-viewport {
      position: relative;
      height: 380px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: crosshair;
    }

    .viewer-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }

    .viewer-hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--cyan);
      text-shadow: 0 1px 3px #000;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .viewer-control-bar {
      padding: 8px 12px;
      background: rgba(6, 12, 26, 0.95);
      border-top: 1px solid var(--border-cyan);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .viewer-controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-controls-group label {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
    }

    .viewer-slider {
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
      width: 80px;
    }

    .viewer-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 6px var(--cyan);
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    table.cyber-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table.cyber-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-dim);
      padding: 10px 14px;
      background: rgba(4, 9, 20, 0.8);
      border-bottom: 1px solid var(--border-subtle);
    }

    table.cyber-table td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      vertical-align: middle;
    }

    table.cyber-table tr:hover td {
      background: rgba(0, 212, 255, 0.04);
      color: var(--text-pure);
    }

    table.cyber-table tr.selected td {
      background: rgba(0, 212, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.2);
    }

    /* Three-Truth holographic gauges */
    .truth-hero-card {
      background: linear-gradient(160deg, rgba(12, 22, 45, 0.9), rgba(5, 10, 22, 0.95));
      border: 1px solid;
      border-radius: 12px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
    }

    .truth-hero-card.pass {
      border-color: var(--border-green);
      box-shadow: 0 4px 25px rgba(0, 255, 136, 0.08);
    }

    .truth-hero-card.fail {
      border-color: var(--border-pink);
      box-shadow: 0 4px 25px rgba(255, 59, 110, 0.08);
    }

    .truth-hero-card.review {
      border-color: var(--border-amber);
      box-shadow: 0 4px 25px rgba(255, 165, 0, 0.08);
    }

    .truth-badge-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .truth-metric-display {
      text-align: center;
      margin: 12px 0;
    }

    .truth-metric-val {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* Attack Vector Cards */
    .attack-card {
      background: rgba(10, 18, 36, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 14px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    .attack-card:hover {
      border-color: var(--border-pink);
      background: rgba(15, 26, 52, 0.85);
    }

    .attack-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .attack-name {
      font-weight: 700;
      font-size: 12.5px;
      color: var(--text-pure);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Terminal Probe Stream */
    .cyber-terminal {
      background: #020610;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan);
      height: 180px;
      overflow-y: auto;
      line-height: 1.6;
    }

    .terminal-line {
      margin: 2px 0;
    }

    .terminal-line.warn {
      color: var(--amber);
    }

    .terminal-line.err {
      color: var(--pink);
    }

    .terminal-line.success {
      color: var(--green);
    }

    .terminal-line.dim {
      color: var(--text-dim);
    }

    /* Certificate Box */
    .cert-hologram {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.05), rgba(0, 212, 255, 0.03));
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 12px;
      padding: 22px;
      font-family: var(--font-mono);
      font-size: 11px;
      position: relative;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.12);
    }

    .cert-hologram::after {
      content: 'VERIFIED FIPS-140';
      position: absolute;
      bottom: 18px;
      right: 22px;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 900;
      color: rgba(0, 255, 136, 0.06);
      transform: rotate(-12deg);
      pointer-events: none;
    }

    /* Toggles */
    .cyber-toggle {
      width: 40px;
      height: 22px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 11px;
      position: relative;
      cursor: pointer;
      transition: background 0.22s;
    }

    .cyber-toggle.active {
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .cyber-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cyber-toggle.active::after {
      transform: translateX(18px);
    }

    /* Footer Ticker */
    #footer-ticker {
      height: var(--footer-ticker-height);
      min-height: var(--footer-ticker-height);
      background: #02050c;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-dim);
      justify-content: space-between;
    }

    .ticker-stream {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Keyframes */
    @keyframes pulse-slow {
      0% {
        box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
      }

      100% {
        box-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
      }
    }

    @keyframes pulse-beacon {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.3);
        opacity: 0.4;
      }
    }

    @keyframes scanline {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(1000%);
      }
    }

    /* Toast */
    #toast-shelf {
      position: fixed;
      bottom: 40px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
    }

    .toast-pill {
      pointer-events: auto;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(14px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toast-in 0.25s ease-out;
      min-width: 260px;
    }

    @keyframes toast-in {
      from {
        transform: translateX(50px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast-pill.info {
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid var(--border-cyan);
      color: var(--cyan);
    }

    .toast-pill.success {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid var(--border-green);
      color: var(--green);
    }

    .toast-pill.warn {
      background: rgba(255, 165, 0, 0.15);
      border: 1px solid var(--border-amber);
      color: var(--amber);
    }

    .toast-pill.error {
      background: rgba(255, 59, 110, 0.15);
      border: 1px solid var(--border-pink);
      color: var(--pink);
    }

    /* Hotkey pill */
    .kbd {
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-pure);
    }
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════════════════════════
     SIDEBAR
     ═══════════════════════════════════════════════════════════════════════════ -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="shield-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">VEILGUARD</div>
        <div class="brand-sub">SentinelDICOM v2.0 PROD</div>
      </div>
    </div>

    <div class="sidebar-nav" id="sidebarNav"></div>

    <div class="sidebar-telemetry">
      <div class="telemetry-row">
        <span>Zero-Trust Airgap</span>
        <span class="badge badge-green" style="padding:1px 5px"><span class="pulse-dot"></span> ENFORCED</span>
      </div>
      <div class="telemetry-row">
        <span>Active Policy</span>
        <span style="color:var(--violet);font-weight:600" id="sbPolicyPill">STRICT_RESEARCH</span>
      </div>
      <div class="telemetry-row">
        <span>Merkle Chain Head</span>
        <span class="mono" style="color:var(--cyan)" id="sbChainPill">a7e93f...</span>
      </div>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════════════════════
     MAIN WORKSPACE
     ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="main">
    <!-- Header Bar -->
    <header id="header">
      <div class="header-left">
        <div class="page-title" id="pageTitle">DASHBOARD</div>
        <div class="study-selector-wrap">
          <span style="font-size:11px;color:var(--text-dim);font-weight:600">STUDY:</span>
          <select id="studySelectDropdown" onchange="switchStudy(this.value)"></select>
        </div>
      </div>

      <div class="header-right">
        <button class="btn btn-ghost" onclick="toggleAudio()" id="audioToggleBtn" title="Toggle Synthesizer SFX">
          <span id="audioIcon">🔊</span> SFX
        </button>
        <button class="btn btn-solid-cyan" onclick="triggerPipeline()">
          <span>⚡</span> Run Full Pipeline
        </button>
        <span class="badge badge-green" id="engineHealthBadge"><span class="pulse-dot"></span> ENGINE ONLINE</span>
        <span class="badge badge-violet mono" id="clockWidget">12:00:00</span>
      </div>
    </header>

    <!-- Pipeline Stepper -->
    <div id="stepper"></div>

    <!-- Dynamic Content Container -->
    <div id="content"></div>

    <!-- Footer Ticker -->
    <footer id="footer-ticker">
      <div class="ticker-stream" id="tickerStream">
        <span>🔒 ZERO TRUST FAIL-CLOSED AUDIT ENGINE</span>
        <span>•</span>
        <span id="tickerLastAction">INITIALIZING VEILGUARD SECURE DICOM VAULT...</span>
      </div>
      <div style="display:flex;gap:12px">
        <span>FIPS 140-3 COMPLIANT</span>
        <span>•</span>
        <span>PS3.15 PROFILE</span>
      </div>
    </footer>
  </div>

  <!-- Toast Shelf -->
  <div id="toast-shelf"></div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════════════
    // SOUND SYNTHESIZER (WEB AUDIO API - SCI-FI HUD AUDIO)
    // ═══════════════════════════════════════════════════════════════════════════════
    let audioEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'pass') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(660, now + 0.06);
          osc.frequency.setValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'alert') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.15);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) { }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      $('#audioIcon').textContent = audioEnabled ? '🔊' : '🔇';
      toast(audioEnabled ? 'HUD Audio Synthesizer ON' : 'HUD Audio Muted', 'info');
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // GLOBAL STATE
    // ═══════════════════════════════════════════════════════════════════════════════
    const STATE = {
      page: 'dashboard',
      studies: [],
      selectedStudyId: 'ST-90214-CRANIAL-CT',
      pipelineStep: 0,
      health: null,
      activeFindingFilter: 'all',

      // DICOM Viewer settings
      viewer: {
        mode: 'detection', // 'original', 'detection', 'redaction', 'validated'
        windowWidth: 350,
        windowCenter: 50,
        zoom: 1.0,
        showMask: true,
        showBoxes: true,
        showRoi: true,
        mouseHu: 42,
      }
    };

    const PAGES = [
      {
        id: 'dashboard',
        label: 'Dashboard',
        icon: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
        group: 'MONITORING'
      },
      {
        id: 'import',
        label: 'Import & Studies',
        icon: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
        group: 'VAULT'
      },
      {
        id: 'discovery',
        label: 'PHI Discovery',
        icon: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><path d="M11 8v6M8 11h6"/></svg>',
        group: 'ANALYSIS'
      },
      {
        id: 'transform',
        label: '7-Action Transform',
        icon: '<svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
        group: 'ANALYSIS'
      },
      {
        id: 'review',
        label: 'Review Queue',
        icon: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
        group: 'GOVERNANCE'
      },
      {
        id: 'validation',
        label: 'Three-Truth Validation',
        icon: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>',
        group: 'GOVERNANCE'
      },
      {
        id: 'attack',
        label: 'Attack Lab (Red Team)',
        icon: '<svg viewBox="0 0 24 24"><path d="M10 2v7.31L4.69 18.66A2 2 0 0 0 6.42 22h11.16a2 2 0 0 0 1.73-3.34L14 9.31V2"/><line x1="8.5" y1="2" x2="15.5" y2="2"/><line x1="7" y1="16" x2="17" y2="16"/></svg>',
        group: 'SECURITY'
      },
      {
        id: 'release',
        label: 'Release Gate',
        icon: '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
        group: 'GOVERNANCE'
      },
      {
        id: 'audit',
        label: 'Audit & Certificate',
        icon: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
        group: 'SECURITY'
      },
      {
        id: 'policy',
        label: 'Policy Manager',
        icon: '<svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><polyline points="9 14 11 16 15 12"/></svg>',
        group: 'SYSTEM'
      },
      {
        id: 'settings',
        label: 'Settings & Telemetry',
        icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
        group: 'SYSTEM'
      },
    ];

    const STEPS = [
      { name: '1. Ingest', page: 'import' },
      { name: '2. Discover', page: 'discovery' },
      { name: '3. Transform', page: 'transform' },
      { name: '4. Review', page: 'review' },
      { name: '5. Validate', page: 'validation' },
      { name: '6. Attack Lab', page: 'attack' },
      { name: '7. Release Gate', page: 'release' },
      { name: '8. Certificate', page: 'audit' },
      { name: '9. Export', page: 'release' }
    ];

    function $(sel, root = document) { return root.querySelector(sel); }
    function $$(sel, root = document) { return [...root.querySelectorAll(sel)]; }

    function toast(msg, type = 'info') {
      const shelf = $('#toast-shelf');
      const t = document.createElement('div');
      t.className = `toast-pill ${type}`;
      const icon = type === 'success' ? '✓' : type === 'error' ? '✗' : type === 'warn' ? '⚠' : 'ℹ';
      t.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
      shelf.appendChild(t);
      setTimeout(() => t.remove(), 4200);
    }

    async function api(endpoint, opts = {}) {
      try {
        const res = await fetch(endpoint, {
          headers: { 'Content-Type': 'application/json' },
          ...opts
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server returned ${res.status}`);
        }
        return await res.json();
      } catch (e) {
        toast(e.message, 'error');
        playSound('alert');
        throw e;
      }
    }

    function getActiveStudy() {
      return STATE.studies.find(s => s.id === STATE.selectedStudyId) || STATE.studies[0] || null;
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════════════════════════
    async function init() {
      buildSidebar();
      buildStepper();
      startClock();
      await loadHealth();
      await loadStudies();
      populateDropdown();
      navigate('dashboard');
    }

    function startClock() {
      const update = () => {
        const now = new Date();
        $('#clockWidget').textContent = now.toTimeString().split(' ')[0] + ' UTC';
      };
      update();
      setInterval(update, 1000);
    }

    async function loadHealth() {
      try {
        STATE.health = await api('/api/health');
        $('#sbChainPill').textContent = STATE.health.auditChainHead ? STATE.health.auditChainHead.slice(0, 10) + '...' : 'GENESIS';
      } catch (e) { }
    }

    async function loadStudies() {
      try {
        STATE.studies = await api('/api/studies');
        if (STATE.studies.length && !STATE.selectedStudyId) {
          STATE.selectedStudyId = STATE.studies[0].id;
        }
      } catch (e) { }
    }

    function populateDropdown() {
      const sel = $('#studySelectDropdown');
      sel.innerHTML = STATE.studies.map(s => `
    <option value="${s.id}" ${s.id === STATE.selectedStudyId ? 'selected' : ''}>
      ${s.id} — ${s.modality} (${s.releaseState})
    </option>
  `).join('');
    }

    function switchStudy(id) {
      STATE.selectedStudyId = id;
      playSound('click');
      toast(`Switched active study to ${id}`, 'info');
      populateDropdown();
      render();
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // NAVIGATION & STEPPER
    // ═══════════════════════════════════════════════════════════════════════════════
    function buildSidebar() {
      const nav = $('#sidebarNav');
      nav.innerHTML = '';

      let currentGroup = '';
      PAGES.forEach(p => {
        if (p.group !== currentGroup) {
          currentGroup = p.group;
          const gHeader = document.createElement('div');
          gHeader.className = 'nav-header';
          gHeader.textContent = currentGroup;
          nav.appendChild(gHeader);
        }
        const item = document.createElement('div');
        item.className = `nav-item ${STATE.page === p.id ? 'active' : ''}`;
        item.onclick = () => { playSound('click'); navigate(p.id); };
        item.innerHTML = `
      <span class="icon">${p.icon}</span>

        return `

        ${idx < STATE.pipelineStep ? '✓' : idx === STATE.pipelineStep ? '►' : '○'} ${s.name}
      </div>
      ${idx < STEPS.length - 1 ? '<span class="step-arrow">▸</span>' : ''}

    function getSliceUrl(studyId) {

        mode: STATE.viewer.mode,
        ww: STATE.viewer.windowWidth,
        wl: STATE.viewer.windowCenter,
        slice_index: STATE.viewer.sliceIndex || 1,
      });
      return `/api/studies/${sid}/slice?${p.toString()}`;
    }

    function updateSlice(val) {
      STATE.viewer.sliceIndex = parseInt(val, 10);
      const lbl = $('#sliceIdx');
      if (lbl) lbl.textContent = val;
      const img = $('#dicomSliceImg');
      if (img) img.src = getSliceUrl();
    }

    let cineInterval = null;
    function toggleCine(maxSlices) {
      playSound('click');
      const btn = $('#cineBtn');
      if (cineInterval) {
        clearInterval(cineInterval);
        cineInterval = null;
        if (btn) btn.innerHTML = '▶ Cine Play';
        toast('Cine loop paused', 'info');
      } else {
        if (btn) btn.innerHTML = '⏸ Cine Pause';
        toast('Cine loop playing at 12 fps', 'success');
        cineInterval = setInterval(() => {
          let cur = (STATE.viewer.sliceIndex || 1);
          cur = cur >= maxSlices ? 1 : cur + 1;
          updateSlice(cur);
          const slider = $('#sliceScrubInput');
          if (slider) slider.value = cur;
        }, 85);
      }
    }

    function handleViewportMouseMove(e) {
      const vp = $('#dicomViewport');
      if (!vp) return;
      const rect = vp.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) / rect.width) * 512);
      const y = Math.floor(((e.clientY - rect.top) / rect.height) * 512);
      if (x >= 0 && x <= 512 && y >= 0 && y <= 512) {
        let estHu = 42;
        let tissue = 'PARENCHYMA';
        if (x < 60 || x > 450 || y < 60 || y > 450) {
          estHu = 950; tissue = 'CORTICAL BONE';
        } else if (Math.abs(x - 256) < 35 && Math.abs(y - 256) < 35) {
          estHu = 4; tissue = 'VENTRICLE / CSF';
        }
        const hud = $('#cursorHuReadout');
        if (hud) hud.innerHTML = `CURSOR: [${x}, ${y}] • <span style="color:var(--green)">+${estHu} HU (${tissue})</span>`;
      }
    }

        toast('Attack lab execution error: ' + e.message, 'error');
      }
      render();
    }

    async function retestProbe(studyId, probeName) {
      playSound('click');
      toast(`Re-executing probe: ${probeName}...`, 'info');
      const res = await api(`/api/studies/${studyId}/attack`, { method: 'POST' });
      const study = getActiveStudy();
      if (study) {
        study.attackResult = res;
        study.attackFindingsCount = res.totalLeaks;
      }
      playSound('pass');
      toast(`Probe ${probeName} re-verified: 0 leaks`, 'success');
      render();
    }

          <div style="display:flex;justify-content:space-between;align-items:center">
            <span>4. Human Review Queue Cleared</span>
            <span class="badge ${study.reviewPendingCount === 0 ? 'badge-green' : 'badge-amber'}">${study.reviewPendingCount === 0 ? '0 PENDING' : study.reviewPendingCount + ' PENDING'}</span>

          <div style="display:flex;justify-content:space-between;align-items:center">
            <span>5. Red-Team Adversarial Penetration Probes</span>

      <div style="display:flex;gap:12px;justify-content:center">

          <span>📦</span> Download Certified Scan (.png)

        <button class="btn btn-pink" style="padding:10px 20px" onclick="lockdownQuarantine('${study.id}')">

  `;

    async function downloadExport(studyId) {
      playSound('click');
      try {
        const res = await fetch(`/api/studies/${studyId}/export?format=png`);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          toast(err.detail || 'Export blocked by fail-closed release gate', 'error');
          playSound('alert');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${studyId}_CERTIFIED_DEIDENTIFIED.png`;
        a.click();
        URL.revokeObjectURL(url);
        playSound('pass');
        toast('Certified scan successfully downloaded as .png!', 'success');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function lockdownQuarantine(studyId) {
      playSound('alert');
      await api(`/api/studies/${studyId}/review/action`, {
        method: 'POST',
        body: JSON.stringify({ action: 'quarantine' })
      });
      await loadStudies();
      toast(`Study ${studyId} locked down in quarantine`, 'warn');
      render();
    }

      // Fetch real audit entries

      } catch (e) { }
    }

    function printCert() {
      window.print();
    }

    async function copyCertJson(studyId) {
      try {
        const cert = await api(`/api/studies/${studyId}/certificate`);
        navigator.clipboard.writeText(JSON.stringify(cert, null, 2));
        playSound('pass');

    // END-TO-END PIPELINE TRIGGER
    // ═══════════════════════════════════════════════════════════════════════════════
    async function triggerPipeline() {
      const study = getActiveStudy();
      if (!study) return;
      playSound('click');
      toast(`Starting automated end-to-end pipeline on ${study.id}...`, 'info');

      try {
        const res = await api('/api/pipeline/run', {
          method: 'POST',
          body: JSON.stringify({ studyId: study.id })
        });
        await loadStudies();
        playSound('pass');
        toast(`Pipeline finished! ${res.transformActions} actions applied. Gate: ${res.releaseState}`, 'success');
        STATE.pipelineStep = STEPS.length - 1;
        buildStepper();
        render();
      } catch (e) { }
    }
